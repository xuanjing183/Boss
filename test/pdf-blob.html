  // 路线 3：什么也不搭，让 pdf.js 自己按镜像地址起 worker。跨源时它会包一层
  // importScripts("镜像地址") 的 blob，所以要站点 script-src 明确放行镜像域名，
  // 被拦时它几毫秒就报错（不是挂住），所以放最后、给短超时。
  function pdfUseRemoteWorker() {
    pdfResetWorker();
    pdfjsLib.GlobalWorkerOptions.workerSrc = cfg.pdfWorkerSrc;
    log('PDF worker：站点远程 worker（' + String(cfg.pdfWorkerSrc).replace(/^https?:\/\//, '').slice(0, 40) + '）');
    return true;
  }

  function pdfRevokeBlob() {
    if (!pdfBlobUrl) return;
    try { URL.revokeObjectURL(pdfBlobUrl); } catch (e) { /* 忽略 */ }
    pdfBlobUrl = null;
  }

  function pdfResetWorker() {
    try { pdfjsLib.GlobalWorkerOptions.workerPort = null; } catch (e) { /* 忽略 */ }
    try { delete globalThis.pdfjsWorker; } catch (e) { globalThis.pdfjsWorker = undefined; }
    if (typeof window !== 'undefined') { try { delete window.pdfjsWorker; } catch (e) { /* 忽略 */ } }
    pdfRevokeBlob();
  }

  function pdfWithTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((resolve, reject) => {
        setTimeout(() => reject(new Error(label + '超时 ' + Math.round(ms / 1000) + ' 秒（worker 没响应）')), ms);
      })
    ]);
  }

  async function pdfToText(buf) {
    if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js 没有加载成功');
    pdfResetWorker();      // 上一次导入失败留下的闩锁/残骸先清掉，重试才是干净的
    pdfjsLib.GlobalWorkerOptions.workerSrc = cfg.pdfWorkerSrc;
    await pdfFetchWorkerText();

    const limit = Math.max(5000, Number(cfg.pdfTimeoutMs) || 25000);
    // 顺序按「成功概率 × 失败代价」排：
    //   1. 主线程 fake worker —— 只要沙箱允许 eval 就必成（实测 5ms 抽完 458 字），不碰站点 CSP；
    //   2. 同源 blob workerSrc —— 禁 eval 时的主力兜底，握手完整；
    //   3. 远程 workerSrc —— 要站点放行镜像域名，失败得很快，所以超时给短一点。
    const routes = [
      { name: '主线程 fake worker', setup: pdfUseMainThread, needText: true, ms: limit },
      { name: '同源 blob worker', setup: pdfUseBlobSrc, needText: true, ms: Math.min(limit, 12000) },
      { name: '远程 worker', setup: pdfUseRemoteWorker, needText: false, ms: Math.min(limit, 8000) }
    ];
    let lastErr = null;
    const tried = [];

    for (const route of routes) {
      if (route.needText && !pdfWorkerText) continue;   // 没拿到源码就跳过依赖它的路线
      if (!route.setup()) continue;
      tried.push(route.name);
      try {
        const text = await pdfWithTimeout(runParse(buf), route.ms, 'PDF 解析');
        if (!text || !text.trim()) {
          lastErr = new Error('抽出 0 字');
          log('PDF 路线「' + route.name + '」通了但抽出 0 字，换下一条');
        } else {
          log('PDF 解析成功：路线「' + route.name + '」，' + text.length + ' 字');
          return text;
        }
      } catch (e) {
        lastErr = e;
        log('PDF 路线「' + route.name + '」失败：' + pdfErr(e).slice(0, 150));
      }
      pdfResetWorker();
    }
    throw new Error('PDF 没解析出来（试过 ' + (tried.join(' → ') || '0 条路线') + '；'
      + pdfErr(lastErr).slice(0, 100) + '）。把简历另存为 .txt 再选一次，或直接用文本框粘贴，一样能用。');
  }

  async function runParse(buf) {
    const doc = await pdfjsLib.getDocument({
      data: buf.slice(0),            // 每次给一份新副本：pdf.js 可能把 buffer 转移走（detached）
      disableFontFace: true, isEvalSupported: false, verbosity: 0
    }).promise;
    const out = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      let line = '', lastY = null;
      for (const it of tc.items) {
        if (!it.str) continue;
        const y = it.transform ? it.transform[5] : 0;
        if (lastY !== null && Math.abs(y - lastY) > 3.5) { out.push(line.trim()); line = ''; }
        line += (line && !/\s$/.test(line) && /^[^\s，。、；]/.test(it.str) ? ' ' : '') + it.str;
        lastY = y;
      }
      if (line.trim()) out.push(line.trim());
      out.push('');
    }
    try { await doc.destroy(); } catch (e) { /* 忽略 */ }
    return out.join('\n').replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }
  
// ---- 生产代码结束 ----
var R = [], done = false, t0 = 0;
function add(n, p, x) { R.push({ name: n, pass: !!p, extra: x == null ? '' : String(x) }); }
function render() {
  document.getElementById('rows').innerHTML = R.map(function (r) {
    return '<tr><td>' + r.name + '</td><td class="' + (r.pass ? 'pass">PASS' : 'fail">FAIL') + '</td><td class="extra">' +
      String(r.extra).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</td></tr>';
  }).join('');
  document.getElementById('lgs').textContent = LOGS.join(String.fromCharCode(10));
  var bad = R.filter(function (r) { return !r.pass; }).length;
  document.getElementById('sum').innerHTML = bad ? '<span class="fail">' + bad + ' 项失败</span> / 共 ' + R.length + ' 项'
    : '<span class="pass">全部 ' + R.length + ' 项通过</span>';
  window.__RESULT = R;
}
function finish() { if (done) return; done = true; clearTimeout(watchdog); render(); }
var watchdog = setTimeout(function () {
  add('跑完（没挂死）', false, '卡住了，' + Math.round(performance.now() - t0) + 'ms 仍无结论；阶段日志：' + LOGS.join(' | '));
  render();
}, 45000);
(async function () {
  t0 = performance.now();
  add('pdf.js 从镜像加载成功', typeof pdfjsLib !== 'undefined', typeof pdfjsLib === 'undefined' ? 'undefined（网络不通）' : 'v' + pdfjsLib.version);
  if (typeof pdfjsLib === 'undefined') { return finish(); }
  var bin = atob(window.__B64);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  var text = null, err = null;
  try { text = await pdfToText(buf); } catch (e) { err = e; }
  var ms = Math.round(performance.now() - t0);
  var all = LOGS.join(' ');
  document.getElementById('txt').textContent = text || '';
  var routeM = all.match(/PDF 解析成功：路线「([^」]+)」/);
  var route = routeM ? routeM[1] : null;
  add('路线 1 被 CSP 拦住并记录', /沙箱里 eval 被拦|没拿到 WorkerMessageHandler/.test(all), (all.match(/路线 1[^|]{0,60}/) || ['无'])[0]);
  add('按顺序退到了「同源 blob」', new RegExp('同源 blob').test(all), (all.match(/PDF worker：[^|]{0,34}/g) || ['无']).join('  ->  '));
  add('造出了带 JS MIME 的同源 blob worker 源码', __blobs.some(function (b) { return b.type === 'text/javascript' && b.size > 500000; }), JSON.stringify(__blobs));
  add('有明确结论（没静默挂死）', !!text || !!err, text ? text.length + ' 字 / ' + ms + 'ms' : '抛错 / ' + ms + 'ms');
  if (text) {
    add('抽出文本超过 200 字', text.length > 200, text.length + ' 字');
    add('中文未乱码', /订单中台/.test(text) && /重构/.test(text) && /主导/.test(text), '');
    add('英文技术栈命中', /Spring Boot/.test(text) && /Kubernetes/.test(text) && /Elasticsearch/.test(text), '');
    add('数字与薪资格式命中', /6000/.test(text) && /20-35K/.test(text) && /99\.99/.test(text), '');
    add('按视觉行还原（有换行分段）', /后端开发工程师/.test(text) && text.indexOf(String.fromCharCode(10)) > 0, JSON.stringify(text.slice(0, 40)));
  } else {
    add('报错里说清试过哪几条路（用户能自己判断）', /试过 /.test(String(err && err.message || '')), String(err && err.message || '').slice(0, 130));
    add('失败时给出 .txt 兜底指引', /\.txt|粘贴/.test(String(err && err.message || '')), String(err && err.message || '').slice(0, 160));
  }
  finish();
})();
</script>
